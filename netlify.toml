# Explicit settings so the build doesn't depend on what Netlify auto-detected when
# the site was first linked (the app used to live in a nested folder).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Serves the Next.js build (static pages + the dynamic /table/[id] route). Without
# this the deploy is just the raw .next folder, which 404s at the site root.
[[plugins]]
  package = "@netlify/plugin-nextjs"
