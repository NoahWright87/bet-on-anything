name: Worker preview (per pull request)

# Every PR gets its own live Worker, `bet-on-anything-pr-<number>`, with its own Durable Object
# storage, isolated from production. Cloudflare's built-in preview URLs don't support Durable
# Objects, so this is a real second Worker, deleted again when the PR closes
# (cleanup-worker-preview.yml).
#
# Deliberately no `paths:` filter: next.config.mjs (compute-api-url.mjs) points *every* Netlify
# deploy preview at `bet-on-anything-pr-<REVIEW_ID>`, whether or not the PR touched the Worker,
# so every PR needs its Worker to exist.
#
# PRs from forks don't get repo secrets, so they run the tests but are not deployed.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  # The Netlify site's name: its deploy previews are served from
  # https://deploy-preview-<number>--<NETLIFY_SITE>.netlify.app, and the preview Worker only
  # accepts that origin (plus localhost). Change this if the Netlify site is named differently.
  NETLIFY_SITE: bet-on-anything

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  preview:
    needs: test
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment the preview address
      issues: write
    # A newer push to the same PR replaces an in-flight preview deploy.
    concurrency:
      group: worker-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: Deploy preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # --var replaces ALLOWED_ORIGINS from wrangler.jsonc for this Worker only.
          command: deploy --name bet-on-anything-pr-${{ github.event.pull_request.number }} --var ALLOWED_ORIGINS:http://localhost:3000,https://deploy-preview-${{ github.event.pull_request.number }}--${{ env.NETLIFY_SITE }}.netlify.app

      - name: Comment the preview address on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deploy.outputs.deployment-url }}`;
            const number = context.issue.number;
            const site = `https://deploy-preview-${number}--${{ env.NETLIFY_SITE }}.netlify.app`;
            const marker = '<!-- worker-preview -->';
            const body = marker + '\n\n**Preview Worker deployed.**\n\n' +
              (url ? `API: ${url}\n\n` : 'Deployed, but the address could not be read from the deploy step output; check the "Deploy preview Worker" step log, or it should be `bet-on-anything-pr-' + number + '` on your workers.dev subdomain.\n\n') +
              `This PR's Netlify preview (${site}) is built to talk to it. It is a separate live Worker with its own Durable Object storage, isolated from production, and is deleted automatically when the PR closes.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            const existing = comments.data.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: number, body,
              });
            }
